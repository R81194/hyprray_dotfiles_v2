# -----------------------------------------------------------------------------
# FONTS
# -----------------------------------------------------------------------------
# Ensure you have a Nerd Font installed (e.g., ttf-jetbrains-mono-nerd)
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 12.0

# -----------------------------------------------------------------------------
# WINDOW LAYOUT
# -----------------------------------------------------------------------------
# slightly more padding looks better in tiling WMs
window_padding_width 10 
hide_window_decorations yes
# default, can be explicitly set to 'wayland'
linux_display_server wayland 

# -----------------------------------------------------------------------------
# COLOR SCHEME & OPACITY
# -----------------------------------------------------------------------------
# Range 0.0 to 1.0. 
# 0.8 is a sweet spot for Hyprland blur.
background_opacity 0.5

# Optional: Dim text in inactive windows
inactive_text_alpha 0.8

# -----------------------------------------------------------------------------
# CURSOR & MOUSE
# -----------------------------------------------------------------------------
cursor_shape beam
cursor_blink_interval 0.4
mouse_hide_wait 3.0
url_style curly

cursor_trail 14
cursor_trail_start_threshold 0
cursor_trail_decay 0.03 0.07


# -----------------------------------------------------------------------------
# SCROLLBACK
# -----------------------------------------------------------------------------
scrollback_lines 2000
wheel_scroll_multiplier 5.0

# -----------------------------------------------------------------------------
# PERFORMANCE
# -----------------------------------------------------------------------------
# Lower delay helps with high refresh rate monitors
repaint_delay 10
input_delay 3
sync_to_monitor yes

# -----------------------------------------------------------------------------
# KEYBINDINGS
# -----------------------------------------------------------------------------
# Clipboard (ctrl+shift+c / v is standard)
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Font sizing
map ctrl+plus change_font_size all +2.0
map ctrl+minus change_font_size all -2.0
map ctrl+0 change_font_size all 0

# -----------------------------------------------------------------------------
# COLORS (Catppuccin Mocha - Example)
# -----------------------------------------------------------------------------
# You can comment this out and include a separate theme file if preferred
foreground              #CDD6F4
background              #1E1E2E
selection_foreground    #1E1E2E
selection_background    #F5E0DC

# Cursor colors
cursor                  #F5E0DC
cursor_text_color       #1E1E2E

# URL underline color when hovering with mouse
url_color               #F5E0DC

# Kitty window border colors
active_border_color     #B4BEFE
inactive_border_color   #6C7086
bell_border_color       #F9E2AF

tab_bar_edge bottom
tab_bar_margin_width 0.0
tab_bar_margin_height 0.0 0.0
tab_bar_style powerline
tab_bar_align left
tab_powerline_style slanted
# Tab bar colors
active_tab_foreground   #11111B
active_tab_background   #CBA6F7
inactive_tab_foreground #CDD6F4
inactive_tab_background #181825
tab_bar_background      #11111B

disable_ligatures never
enable_audio_bell no

shell zsh
shell_integration no-cursor
sync_to_monitor no


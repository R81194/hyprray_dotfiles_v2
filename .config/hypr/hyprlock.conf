general {
    no_fade_in = true
    no_fade_out = true
    hide_cursor = false
    grace = 0
    disable_loading_bar = true
}


background {
  monitor =
	path = screenshot  
  blur_passes = 2
  contrast = 1
  brightness = 0.5
  vibrancy = 0.2
  vibrancy_darkness = 0.2
}

label {
  monitor =
  text = $TIME
  text_trim = true
  color = rgba(220, 220, 220, 1)
  font_size = 80
  font_family = JetBrains Mono Nerd Font ExtraBold Italic
  position = 0, 0
  halign = center
  valign = top
}

label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%A, %B %d")"
  color = rgba(220, 220, 220, 1)
  font_size = 22
  font_family = JetBrains Mono Nerd Font ExtraBold Italic
  position = 0, -140
  halign = center
  valign = top
}

label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/scripts/nowplaying/nowplaying.sh)" 
    color = rgba(255, 255, 255, 0.6)
    font_size = 18
    font_family = JetBrains Mono Nerd, SF Pro Display Bold
    position = 10, 20
    halign = left
    valign = bottom
}

image {
    monitor =
    path = ~/.config/scripts/nowplaying/album_art.jpg
    onclick = "$(~/.config/scripts/nowplaying/nowplaying.sh --toggle)"
    border_size = 2
    border_color = rgba(255, 255, 255, 0)
    size = 150
    rounding = 14
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = 10, 120
    halign = left
    valign = bottom
}

label {
  monitor = 
  text = cmd[update:60000] echo "$(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null | head -n1 | sed 's/$/%/')"
  font_family = JetBrainsMono Nerd Font
  font_size = 12
  color = rgba(200,200,200,1.0)
  position = -30, 10
  halign = right
  valign = bottom
}

image {
  monitor =
  path = ~/.config/hypr/user.png
  border_size = 2
  border_color = rgba(255, 255, 255, 0)
  size = 250
  rounding = -1
  rotate = 0
  reload_time = -1
  reload_cmd = 
  position = 0, 60
  halign = center
  valign = center
}

label {
  monitor = 
  text = Ray
  font_family = JetBrainsMono Nerd Font ExtraBold
  font_size = 32
  color = rgba(255,255,255,1.0)
  position = 0, -130
  halign = center
  valign = center
}

input-field {
  monitor = 
  size = 250, 52
  rounding = 14
  position  =0, -200
  dots_size = 0.25
  dots_spacing  = 0.35
  dots_center = true
  outline_thickness = 2
  outer_color = rgba(255,255,255,0.8)
  inner_color = rgba(15, 15, 0, 0.2)
  font_color = rgb(255, 255, 255)
  fade_on_empty = true
  placeholder_text = <i>Enter Password</i>
  halign = center
  valign = center
}

label {
  monitor = 
  text = $FAIL
  font_family = JetBrainsMono Nerd Font
  font_size = 18
  color = rgba(255,80,80,1)
  position = 0, 110
  halign = center
  valign = center
}


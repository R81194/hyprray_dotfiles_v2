#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24 # Sets standard X11 cursor size
env = HYPRCURSOR_SIZE,24 # Sets Hyprland specific cursor size
env = XDG_SESSION_TYPE,wayland # Forces applications to use Wayland natively if possible
env = LIBVA_DRIVER_NAME,nvidia # Enables hardware video acceleration for NVIDIA
env = GBM_BACKEND,nvidia-drm # Generic Buffer Management backend for NVIDIA
env = __GLX_VENDOR_LIBRARY_NAME,nvidia # OpenGL vendor library specification for NVIDIA

cursor {no_hardware_cursors = true} # Fixes disappearing cursor issues common on NVIDIA cards
##################
### ANIMATIONS ###
##################

# # https://wiki.hypr.land/Configuring/Variables/#animations
# animations {
#     enabled = yes, please :) # Master switch to enable UI animations

#     # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
#     #        NAME,           X0,   Y0,   X1,   Y1
#     bezier = easeOutQuint,   0.23, 1,    0.32, 1 # Custom Bezier curve definition for smooth deceleration
#     bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1 # Custom Bezier curve definition for slow start/end
#     bezier = linear,         0,    0,    1,    1 # Linear (constant speed) curve definition
#     bezier = almostLinear,   0.5,  0.5,  0.75, 1 # Custom Bezier curve for near-constant speed
#     bezier = quick,          0.15, 0,    0.1,  1 # Snappy Bezier curve definition

#     # Default animations, see https://wiki.hypr.land/Configuring/Animations/
#     #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
#     animation = global,        1,     10,    default # Fallback default animation settings
#     animation = border,        1,     5.39,  easeOutQuint # Animation for border color transitions
#     animation = windows,       1,     4.79,  easeOutQuint # General window creation/destruction animation
#     animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87% # Animation for windows opening (pop-in effect)
#     animation = windowsOut,    1,     1.49,  linear,       popin 87% # Animation for windows closing
#     animation = fadeIn,        1,     1.73,  almostLinear # Fade-in effect duration and curve
#     animation = fadeOut,       1,     1.46,  almostLinear # Fade-out effect duration and curve
#     animation = fade,          1,     3.03,  quick # General fade effect settings
#     animation = layers,        1,     3.81,  easeOutQuint # Animation for UI layers (like waybar or rofi)
#     animation = layersIn,      1,     4,     easeOutQuint, fade # Animation for layers appearing
#     animation = layersOut,     1,     1.5,   linear,       fade # Animation for layers disappearing
#     animation = fadeLayersIn,  1,     1.79,  almostLinear # Layer fade-in effect
#     animation = fadeLayersOut, 1,     1.39,  almostLinear # Layer fade-out effect
#     animation = workspaces,    1,     2.9,  easeOutQuint, slidefade 100%
#     animation = workspacesOut, 1,     2.9,  easeOutQuint, slidefade 100%
#     animation = workspacesIn,  1,     2.9,  easeOutQuint, slidefade 100% 
#     animation = specialWorkspaceIn, 1,  3, easeOutQuint, slidefadevert 100%
#     animation = specialWorkspaceOut, 1,  3, easeOutQuint, slidefadevert 100%
#     animation = zoomFactor,    1,     7,     quick # Desktop zoom animation speed
#     animation = workspaces, 1, 3, easeOutQuint, slidefade 100% # Workspace switching animation (slide and fade combo)
# }
animations {
    enabled = true

    # Bezier curves
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    bezier = softSnap, 0.4, 0, 0.2, 1
    bezier = fluent, 0.0, 0.0, 0.2, 1.0
    bezier = easeInOutExpo, 0.87, 0, 0.13, 1

    # Windows
    animation = windows, 1, 5, overshot, popin 80%
    animation = windowsIn, 1, 5, overshot, popin 80%
    animation = windowsOut, 1, 4, smoothOut, popin 95%
    animation = windowsMove, 1, 4, softSnap

    # Layers
    animation = layersIn, 1, 7, smoothIn, slide right
    animation = layersOut, 1, 8, softSnap, slide right

    # Fade
    animation = fade, 1, 4, smoothIn
    animation = fadeIn, 1, 4, smoothIn
    animation = fadeOut, 1, 4, smoothOut
    animation = fadeSwitch, 1, 4, smoothIn
    animation = fadeShadow, 1, 4, smoothIn
    animation = fadeDim, 1, 4, smoothIn
    animation = fadeDpms, 1, 4, smoothIn
    animation = fadeLayers, 1, 3, softSnap

    # Workspaces
    animation = workspaces, 1, 5, overshot, slidefade 30%
    animation = specialWorkspace, 1, 5, overshot, slidefadevert 30%
}
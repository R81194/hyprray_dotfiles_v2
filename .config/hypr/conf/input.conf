#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us # Sets keyboard layout to US English
    kb_variant = # Keyboard variant (e.g., intl, dvorak) - blank uses default
    kb_model = # Keyboard hardware model - blank uses default
    kb_options = # Additional XKB options (e.g., caps:swapescape)
    kb_rules = # Custom XKB rules

    follow_mouse = 1 # Window focus automatically follows the mouse cursor

    sensitivity = -0.2 # -1.0 - 1.0, 0 means no modification. # Master mouse cursor speed

    touchpad {
        natural_scroll = true # Reverses scroll direction (makes two-finger swipe mimic a smartphone)
        
        tap-to-click = true # Allows lightly tapping the touchpad to register as a left mouse click

        scroll_factor = 0.5
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace # Enables three-finger horizontal swipe to switch between workspaces

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1 # Targets a specific piece of mouse hardware by its ID
    sensitivity = -0.5 # Overrides global sensitivity specifically for this hardware
}
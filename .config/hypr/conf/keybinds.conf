###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows/Super" key as the primary modifier for shortcuts

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, T, exec, $terminal # Launches your defined terminal emulator
bind = $mainMod, Q, killactive, # Closes the currently focused window
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit # Exits Hyprland gracefully (logs out)
bind = $mainMod, E, exec, $fileManager # Launches your defined file manager
bind = $mainMod, V, exec, hyprctl --batch "dispatch togglefloating ; dispatch resizeactive exact 80% 80% ; dispatch centerwindow" # Toggles float, sets size to 80%, and centers the window
bind = $mainMod, SPACE, exec, rofi -show drun -click-to-exit -theme ~/.config/rofi/search.rasi # Opens Rofi application launcher with a specific theme
bind = $mainMod, b, exec, $browser # Launches your defined web browser
bind = $mainMod, w, exec, ~/.config/scripts/wallpaper.sh # Executes custom wallpaper script
bind = $mainMod, x, exec, ~/.config/rofi/scripts/powermenu.sh # Opens custom Rofi power/logout menu
bind = $mainMod, l, exec, hyprlock # Locks the screen immediately
bind = $mainMod, C, exec, code # Launches Visual Studio Code
bind = $mainMod, N, exec, swaync-client -rs && swaync-client -t # Reloads SwayNC styles and toggles the notification panel
bind = $mainMod, r, exec, ~/.config/waybar/waybar-switcher.sh #waybar-switcher
bind = $mainMod SHIFT, w, exec, ~/.config/rofi/scripts/wallselect.sh # Opens Rofi menu to select a new wallpaper
bind = $mainMod, P, pseudo, # dwindle # Toggles pseudo-tiling for the current window
# bind = $mainMod, J, togglesplit, # dwindle # Changes the split direction of windows (vertical to horizontal)
bind  = , XF86Launch3, exec, ~/.config/scripts/toggle_focus.sh  #switch focus mode
bind  = , F6, exec, ~/.config/scripts/screenshot.sh  #screenshot

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l # Shifts window focus to the left
bind = $mainMod, right, movefocus, r # Shifts window focus to the right
bind = $mainMod, up, movefocus, u # Shifts window focus up
bind = $mainMod, down, movefocus, d # Shifts window focus down

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1 # Switches screen to workspace 1
bind = $mainMod, 2, workspace, 2 # Switches screen to workspace 2
bind = $mainMod, 3, workspace, 3 # Switches screen to workspace 3
bind = $mainMod, 4, workspace, 4 # Switches screen to workspace 4
bind = $mainMod, 5, workspace, 5 # Switches screen to workspace 5
bind = $mainMod, 6, workspace, 6 # Switches screen to workspace 6
bind = $mainMod, 7, workspace, 7 # Switches screen to workspace 7
bind = $mainMod, 8, workspace, 8 # Switches screen to workspace 8
bind = $mainMod, 9, workspace, 9 # Switches screen to workspace 9
bind = $mainMod, 0, workspace, 10 # Switches screen to workspace 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1 # Throws currently focused window to workspace 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2 # Throws currently focused window to workspace 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3 # Throws currently focused window to workspace 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4 # Throws currently focused window to workspace 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5 # Throws currently focused window to workspace 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6 # Throws currently focused window to workspace 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7 # Throws currently focused window to workspace 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8 # Throws currently focused window to workspace 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9 # Throws currently focused window to workspace 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10 # Throws currently focused window to workspace 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic # Toggles visibility of the hidden 'magic' workspace
bind = $mainMod SHIFT, S, movetoworkspace, special:magic # Sends the focused window to the hidden 'magic' workspace

# Scroll through existing workspaces with mainMod + scroll
bind = ALT, tab, workspace, e+1 # Moves to the next active workspace using ALT+Tab
bind = $mainMod, mouse_up, workspace, e-1 # Moves to the previous active workspace via mouse scroll up
bind = $mainMod, mouse_down, workspace, e+1 # Moves to the next active workspace via mouse scroll down

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow # Click and drag with Super + Left Mouse Button to move a window
bindm = $mainMod, mouse:273, resizewindow # Click and drag with Super + Right Mouse Button to resize a window

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, ~/.config/scripts/volumeosd.sh --inc # Triggers script for Volume Up
bindel = ,XF86AudioLowerVolume, exec, ~/.config/scripts/volumeosd.sh --dec # Triggers script for Volume Down
bindel = ,XF86AudioMute, exec, ~/.config/scripts/volumeosd.sh --toggle # Triggers script to Mute Speakers

bindel = ,XF86AudioMicMute, exec, ~/.config/scripts/volumeosd.sh --toggle-mic # Triggers script to Mute Microphone

bindel = , XF86MonBrightnessUp, exec, ~/.config/scripts/brightnessosd.sh --inc # Triggers script for Screen Brightness Up

bindel = , XF86MonBrightnessDown, exec, ~/.config/scripts/brightnessosd.sh --dec # Triggers script for Screen Brightness Down
# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next # Media Key: Next Track
bindl = , XF86AudioPause, exec, playerctl play-pause # Media Key: Pause
bindl = , XF86AudioPlay, exec, playerctl play-pause # Media Key: Play
bindl = , XF86AudioPrev, exec, playerctl previous # Media Key: Previous Track

bind = , XF86PowerOff, exec, wlogout

# quickshell for overview panel
bind = SUPER, A, exec, qs ipc -c overview call overview toggle
#PLUGINS (configure plugins first)
# bind = SUPER, Tab, hyprexpo:expo, toggle #SUPER+Tab shows overveiwpanel from hyprexpo

# bind = SUPER, Tab, overview:open #SUPER+Tab Toggle the overviewpanel from hyprspace 

bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, down, movewindow, d
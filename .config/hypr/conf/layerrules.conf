####################
### LAYER RULES  ###
####################

layerrule {
  name = blur_rofi # Rule name for UI layer
  match:namespace = rofi # Targets the namespace of the Rofi launcher
  blur = on # Enables the blur effect behind Rofi
  blur_popups = on
  animation = popin 80% # Animates Rofi sliding and fading into view
  dim_around = off # Ensures the rest of the screen does not darken when Rofi is open
  ignore_alpha = 0.5 # Forces blur even on fully transparent parts of the Rofi window
}

layerrule {
    name = blur_swaync # Rule name
    match:namespace = swaync-notification-window # Targets the specific notification panel namespace
    blur = on # Enables blur
    blur_popups = on # Applies blur to smaller tooltips/popups within SwayNC
    # animation = slide right # Slides the notification center in from the right edge
    ignore_alpha = 0.5 # Only blurs pixels that have an opacity greater than 50%
}

layerrule {
    name = blur_swaync2 
    match:namespace = swaync-control-center # Targets the specific control center namespace
    blur = on # Enables blur
    # blur_popups = on 
    # animation = slide right # Slides the control center in from the right edge
    ignore_alpha = 0.5 # Only blurs pixels that have an opacity greater than 50%
    xray = 0
}

layerrule {
    name = blur-waybar # Rule name
    match:namespace = waybar # FIX: Changed from match:class to match:namespace
    blur = on # Enables background blur behind Waybar
    animation = slidefadevert # Animates Waybar sliding and fading in on launch
    ignore_alpha = 1` # Only blurs pixels that have an opacity greater than 50%
}
layerrule {
    name = quickshell-overview # Rule name
    match:namespace = quickshell:overview
    animation = popin 80% 
}
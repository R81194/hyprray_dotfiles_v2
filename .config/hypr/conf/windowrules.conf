windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events # Unique name assigned to this specific rule
    match:class = .* # Uses regex to match absolutely every application class

    suppress_event = maximize # Prevents applications from forcefully maximizing themselves
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags # Unique name assigned to this specific rule
    match:class = ^$ # Matches completely empty class names
    match:title = ^$ # Matches completely empty window titles
    match:xwayland = true # Specifically targets applications running through XWayland
    match:float = true # Only targets windows that are floating
    match:fullscreen = false # Ignores windows that are fullscreen
    match:pin = false # Ignores windows that are pinned to all workspaces

    no_focus = true # Prevents phantom invisible XWayland windows from stealing your focus
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run # Rule name

    match:class = hyprland-run # Targets the specific class of the hyprland-run utility

    move = 20 monitor_h-120 # Places the window exactly 20px from left and 120px from the bottom of the monitor
    float = yes # Forces the window to detach from tiling and float

}


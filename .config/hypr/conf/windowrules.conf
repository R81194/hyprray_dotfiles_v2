windowrule {
    name = no-blur-brave # Rule name
    match:class = brave-browser # Targets the Brave web browser
    opaque = on # Forces Brave to render completely solid (disables transparency/blur on it)
}

windowrule {
    name = blur-cavasik # Rule name
    match:title = Cavasik # Targets any window specifically titled 'Cavasik'
    opacity = 0.4 # Makes the entire window 60% transparent (0.4 opacity level)
}
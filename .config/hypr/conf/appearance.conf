#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 10 # Size of the inner gaps between individual windows
    gaps_out = 20 # Size of the outer gaps between windows and the screen edge
    float_gaps = 10

    border_size = 3 # Thickness of the window borders in pixels

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = $color2 $color1 45deg # Gradient border color for the currently focused window (pulled from pywal)
    col.inactive_border = $background # Solid border color for unfocused background windows (pulled from pywal)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false # Disables click-and-drag resizing directly on window edges

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false # Keeps VSync enabled to prevent screen tearing (set true for minimal latency gaming)

    # layout = dwindle # Sets the default tiling layout algorithm
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 16 # Radius for rounded window corners
    rounding_power = 4 # Smoothness/squircle factor for the rounded corners

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0 # Fully opaque for the currently focused window
    inactive_opacity = 0.8 # Adds slight transparency to unfocused windows

    shadow {
        enabled = true # Turns on drop shadows for windows
        range = 18 # Size and spread of the drop shadow
        render_power = 8 # Falloff intensity of the shadow fade
        color = rgba(1a1a1aee) # Semi-transparent dark gray shadow color
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true # Turns on background blurring for transparent windows
        size = 6 # Radius of the blur effect
        passes = 4 # Number of blur iterations (higher = smoother but more GPU intensive)
        ignore_opacity = true # Makes blur effect independent of window opacity settings
        xray = false # If true, floating windows won't blur tiled windows behind them
        
        vibrancy = 0.1696 # Increases color saturation of the blurred background
        special = true # Applies background blur to the special workspace (scratchpad)
    }
}

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    # pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # Retains split orientations (vertical/horizontal) when closing/opening windows
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master # Specifies that newly spawned windows become the master node in the master layout
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
    # vfr = true # Variable Frame Rate: saves battery by lowering the refresh rate when nothing is moving on screen
}
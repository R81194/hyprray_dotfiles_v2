#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
exec-once = nm-applet & blueman-applet # Starts NetworkManager and Bluetooth system tray icons
exec-once = waybar & awww-daemon # Starts the top status bar and wallpaper daemon
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 # Starts GUI authentication agent for elevated privileges (sudo popups)
exec-once = swaync # Starts the notification center daemon
exec-once = hypridle # Starts the idle management daemon (handles screen lock/sleep)
exec-once = ~/.config/scripts/battery-monitor.sh # Custom script to monitor battery levels
exec-once = hyprpm reload
exec-once = qs -c overview